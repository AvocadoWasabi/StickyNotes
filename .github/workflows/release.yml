name: Package release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a version such as v1.0.0' }
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Publish
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG artifacts/StickyNotes-win-x64.zip artifacts/StickyNotes-win-x64.zip.sha256 --target $env:GITHUB_SHA --draft --title "Markdown Sticky Notes $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
