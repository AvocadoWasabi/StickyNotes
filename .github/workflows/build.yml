name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-win-x64
          path: |
            artifacts/StickyNotes-win-x64.zip
            artifacts/StickyNotes-win-x64.zip.sha256
